name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    name: Desktop (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runs-on: windows-latest
          - platform: linux
            # Pinned: `ubuntu-latest` migrates to Ubuntu 26 in Oct 2026, and the
            # GTK 3 / WebKitGTK 4.1 build deps are validated on 24.04.
            runs-on: ubuntu-24.04
    runs-on: ${{ matrix.runs-on }}

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Electrobun's Linux launcher links GTK 3 and WebKitGTK 4.1.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libpipewire-0.3-dev \
            librsvg2-dev
          sudo apt-get install -y libfuse2t64 2>/dev/null || sudo apt-get install -y libfuse2 2>/dev/null || true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check release versions
        run: bun run release:check

      - name: Full check
        run: bun run check

      - name: Build slim desktop app
        run: bun run desktop:build

      - name: Stash slim artifacts
        shell: bash
        run: |
          mkdir -p "${{ runner.temp }}/stashed-artifacts"
          cp -r artifacts/* "${{ runner.temp }}/stashed-artifacts/"

      - name: Download ImageMagick for bundling
        run: bun run scripts/ensure-bundled-magick.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PICMAGIK_FORCE_BUNDLE: "1"

      - name: Build full desktop app (with ImageMagick)
        run: bun run desktop:build:full
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PICMAGIK_FORCE_BUNDLE: "1"

      - name: Restore slim artifacts
        shell: bash
        run: |
          cp -r "${{ runner.temp }}/stashed-artifacts/"* artifacts/

      - name: Verify release artifacts
        shell: bash
        run: |
          echo "=== Release Artifacts ==="
          ls -lh artifacts/

      - name: Upload installers and update artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.platform }}
          path: artifacts/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: desktop
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Collect artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      # Generated notes only list merged PRs, so prepend the CHANGELOG section
      # to include direct commits and other unreleased work.
      - name: Build release notes
        run: bun run scripts/release-notes.ts "$GITHUB_REF_NAME" > release-notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          files: artifacts/*
          generate_release_notes: true
