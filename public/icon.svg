<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- App Squircle Background Gradient -->
    <linearGradient id="bgGrad" x1="64" y1="32" x2="448" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="55%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>

    <!-- Subtle Inner Border Highlight -->
    <linearGradient id="borderGrad" x1="64" y1="32" x2="448" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.6" />
    </linearGradient>

    <!-- Left Media Pillar Gradient (Cyan -> Indigo) -->
    <linearGradient id="pillarGrad" x1="156" y1="120" x2="156" y2="392" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <!-- Primary Compression Chevron Gradient (Emerald -> Cyan) -->
    <linearGradient id="chevronPrimary" x1="220" y1="140" x2="356" y2="372" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <!-- Secondary Outer Compression Chevron Gradient -->
    <linearGradient id="chevronSecondary" x1="308" y1="176" x2="404" y2="336" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.25" />
    </linearGradient>

    <!-- Soft Drop Shadow for Foreground Elements -->
    <filter id="glowShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Main Squircle Base -->
  <rect x="28" y="28" width="456" height="456" rx="108" fill="url(#bgGrad)" />
  <rect x="30" y="30" width="452" height="452" rx="106" stroke="url(#borderGrad)" stroke-width="4" />

  <!-- Subtle Background Grid / Compression Guide Lines -->
  <line x1="100" y1="256" x2="412" y2="256" stroke="#38BDF8" stroke-opacity="0.07" stroke-width="2" stroke-dasharray="8 8" />

  <g filter="url(#glowShadow)">
    <!-- Left Vertical Pillar of the 'K' (Media Strip) -->
    <rect x="128" y="120" width="60" height="272" rx="22" fill="url(#pillarGrad)" />

    <!-- Film/Frame Perforation Notches Inside the Pillar -->
    <rect x="145" y="148" width="26" height="18" rx="5" fill="#0F172A" fill-opacity="0.45" />
    <rect x="145" y="247" width="26" height="18" rx="5" fill="#0F172A" fill-opacity="0.45" />
    <rect x="145" y="346" width="26" height="18" rx="5" fill="#0F172A" fill-opacity="0.45" />

    <!-- Secondary (Outer) Inward Compression Chevron -->
    <path d="M 386 176 L 306 256 L 386 336"
          stroke="url(#chevronSecondary)"
          stroke-width="38"
          stroke-linecap="round"
          stroke-linejoin="round" />

    <!-- Primary (Inner) Inward Compression Chevron Forming the 'K' -->
    <path d="M 334 142 L 222 256 L 334 370"
          stroke="url(#chevronPrimary)"
          stroke-width="56"
          stroke-linecap="round"
          stroke-linejoin="round" />
  </g>
</svg>
